name: Deploy to GH Pages
on:
  push:
    branches: [master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: isadics/setup-elm@v5
        with:
          elm-version: 0.19.1
      - run: elm make src/HomePage.elm --output=elm.js --optimize
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
