<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>iskoog.dev</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="terminal-wrapper">
            <div class="titlebar">
                <div class="titlebar-dot dot-red"></div>
                <div class="titlebar-dot dot-yellow"></div>
                <div class="titlebar-dot dot-green"></div>
                <div class="titlebar-title">iskoog@dev — bash</div>
                <div class="titlebar-status">
                    <span class="dot-live"></span>online
                </div>
            </div>

            <div class="terminal" id="terminal">
                <div id="output"></div>
            </div>
        </div>

        <div class="suggestions">
            <div class="suggestions-inner" id="suggestions"></div>
        </div>

        <div class="input-wrapper">
            <div class="input-area">
                <span class="prompt">iskoog@dev:~$&nbsp;</span>
                <input
                    type="text"
                    id="command"
                    placeholder="type a command… (try 'help')"
                    autofocus
                    autocomplete="off"
                    spellcheck="false"
                />
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
